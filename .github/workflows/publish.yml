# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build & Publish NuGet packages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - release

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Trusted builder: build + SignPath signing + provenance live in the
  # reusable workflow; only its isolated `assemble` job can attest.
  build:
    # Union grant: the caller must hold every permission any job of the called
    # workflow needs; the called workflow can only downgrade, never extend.
    # id-token/attestations:write end up ONLY in the assemble job over there —
    # the build job itself runs with contents/actions: read.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-reusable.yml
    with:
      mode: ${{ inputs.mode }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  publish:
    # needs: build waits for the called workflow as a whole — including its
    # assemble job, so the provenance exists before anything is published.
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write       # create GitHub Release
      # id-token here is SOLELY for NuGet trusted publishing (NuGet/login),
      # NOT for attestations — the publish job cannot write attestations.
      id-token: write
    env:
      MODE: ${{ inputs.mode }}

    steps:
    - name: Checkout source
      uses: actions/checkout@v7

    - name: Resolve version context
      id: version
      uses: ./.github/actions/resolve-version

    # The signed packages produced by the trusted builder land exactly where
    # the push loop below expects them.
    - name: Download signed NuGet packages
      uses: actions/download-artifact@v8
      with:
        name: signed-nupkg
        path: artifacts/package/release

    # -------------------------------------------------
    # MODE INFO
    # -------------------------------------------------
    - name: Release mode info
      shell: bash
      run: |
        VERSION=${{ steps.version.outputs.version }}
        TAG=v$VERSION
        ARCHIVE=release-$TAG.tar.gz
        echo "=============================="
        echo "MODE: $MODE"
        echo "VERSION: $VERSION"
        echo "ARCHIVE: $ARCHIVE"
        echo "=============================="

        case "$MODE" in
          dry-run)
            echo "🧪 DRY RUN MODE (build tested, no release)"
            ;;
          release)
            echo "🚀 REAL RELEASE MODE (will publish)"
            ;;
        esac

    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      if: ${{ inputs.mode == 'release' }}
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    # Push the packages
    - name: Push NuGet packages
      if: ${{ inputs.mode == 'release' }}
      shell: pwsh
      run: |
        $packages = Get-ChildItem -Path "artifacts/package/release" -Filter "*.nupkg"
        foreach ($pkg in $packages) {
            Write-Host "Pushing $($pkg.FullName)"
            dotnet nuget push $pkg.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
        }
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

    # The release body lives as a template next to the workflow
    # (.github/release-body.md.in) instead of ~45 inline YAML lines;
    # @VERSION@ is the only substituted token. Rendered in every mode so a
    # dry-run also smoke-tests the template.
    - name: Render release notes
      shell: bash
      run: |
        sed "s/@VERSION@/$VERSION/g" .github/release-body.md.in > release-body.md

    - name: Create GitHub Release
      if: ${{ inputs.mode == 'release' }}
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: SQLite3MC ${{ steps.version.outputs.version }} NuGet Packages
        body_path: release-body.md
